#cloud-config
# Stardust web server: 2 GB swap, Docker, Caddy (static site + HTTPS), a Redis sidecar for sessions,
# and Litestream, which streams the SQLite database in /opt/app/data to Object Storage.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - git

write_files:
  - path: /opt/app/.env
    permissions: "0600"
    content: |
      REDIS_PASSWORD=${redis_password}
      DATABASE_PATH=/data/app.db
      LITESTREAM_ACCESS_KEY_ID=${backup_key_id}
      LITESTREAM_SECRET_ACCESS_KEY=${backup_secret}

  - path: /opt/app/litestream.yml
    content: |
      dbs:
        - path: /data/app.db
          replicas:
            - type: s3
              bucket: ${backup_bucket}
              path: app.db
              endpoint: https://s3.${region}.scw.cloud
              region: ${region}

  - path: /opt/app/Caddyfile
    content: |
%{ if domain != "" ~}
      www.${domain} {
        redir https://${domain}{uri} permanent
      }

      ${domain} {
%{ else ~}
      :80 {
%{ endif ~}
        root * /srv/site
        file_server
        encode gzip
        # Never serve the repo's infra and git files.
        @private path /infra/* /.git/* /.github/*
        respond @private 404
        # Later: send /api/* to the app container, e.g.
        # reverse_proxy /api/* app:3000
      }

  # Keep the site in step with the repo (Caddy reads the files live, no restart needed).
  - path: /etc/cron.d/site-pull
    content: |
      */5 * * * * root git -C /opt/app/site pull -q --ff-only >/dev/null 2>&1

  - path: /opt/app/docker-compose.yml
    content: |
      services:
        caddy:
          image: caddy:2-alpine
          restart: unless-stopped
          ports: ["80:80", "443:443"]
          volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./site:/srv/site:ro
            - caddy_data:/data
          mem_limit: 128m

        redis:
          # Sidecar for sessions: only reachable inside the compose network, never published.
          image: redis:7-alpine
          restart: unless-stopped
          command: >
            redis-server --requirepass $${REDIS_PASSWORD}
            --maxmemory 64mb --maxmemory-policy allkeys-lru
            --save 300 10 --appendonly no
          env_file: .env
          volumes:
            - redis_data:/data
          mem_limit: 96m

        # On a fresh server: pull the database back from the bucket (no-op if there is no backup yet).
        litestream-restore:
          image: litestream/litestream:0.3.13
          command: restore -config /etc/litestream.yml -if-db-not-exists -if-replica-exists /data/app.db
          env_file: .env
          volumes:
            - ./litestream.yml:/etc/litestream.yml:ro
            - ./data:/data
          restart: "no"

        # Streams every change of /data/app.db to the bucket, about once a second.
        litestream:
          image: litestream/litestream:0.3.13
          command: replicate -config /etc/litestream.yml
          restart: unless-stopped
          env_file: .env
          volumes:
            - ./litestream.yml:/etc/litestream.yml:ro
            - ./data:/data
          depends_on:
            litestream-restore:
              condition: service_completed_successfully
          mem_limit: 64m

        # Your future app goes here; it gets DATABASE_PATH (SQLite) and REDIS_PASSWORD from .env:
        # app:
        #   build: ./site/server
        #   restart: unless-stopped
        #   env_file: .env
        #   environment:
        #     REDIS_URL: redis://:$${REDIS_PASSWORD}@redis:6379
        #   volumes:
        #     - ./data:/data
        #   depends_on:
        #     redis: { condition: service_started }
        #     litestream-restore: { condition: service_completed_successfully }
        #   mem_limit: 256m

      volumes:
        caddy_data:
        redis_data:

runcmd:
  # 2 GB swap: Stardust has only 1 GB RAM.
  - fallocate -l ${swap_size_gb}G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl -w vm.swappiness=10
  - echo 'vm.swappiness=10' > /etc/sysctl.d/99-swappiness.conf
  # Redis wants this to avoid latency spikes.
  - sysctl -w vm.overcommit_memory=1
  - echo 'vm.overcommit_memory=1' > /etc/sysctl.d/99-redis.conf
  # Site + containers
  - systemctl enable --now docker
  - git clone --depth 1 ${repo_url} /opt/app/site
  - mkdir -p /opt/app/data
  - cd /opt/app && docker compose up -d
