<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成语谚语 · Chinese Proverbs</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a2e;
    --card-hover: #222244;
    --accent: #e94560;
    --text: #eee;
    --text-muted: #999;
    --border: #2a2a4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 2rem 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  }
  header h1 { font-size: 2rem; font-weight: 300; letter-spacing: 2px; }
  header h1 span { color: var(--accent); font-weight: 600; }
  header p { color: var(--text-muted); margin-top: .4rem; font-size: .95rem; }
  .lessons {
    max-width: 700px;
    margin: 2rem auto;
    padding: 0 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .lesson-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem 1.8rem;
    text-decoration: none;
    color: var(--text);
    transition: all .25s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lesson-card:hover { background: var(--card-hover); border-color: var(--accent); transform: translateX(4px); }
  .lesson-card .info h3 { font-size: 1.2rem; font-weight: 500; margin-bottom: .3rem; }
  .lesson-card .info p { color: var(--text-muted); font-size: .85rem; line-height: 1.4; }
  .lesson-card .lesson-num {
    background: var(--accent);
    color: #fff;
    font-size: .8rem;
    font-weight: 600;
    padding: .3rem .7rem;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 1rem;
  }
  @media (max-width: 600px) {
    header h1 { font-size: 1.4rem; }
    .lesson-card { flex-direction: column; align-items: flex-start; gap: .8rem; }
    .lesson-card .lesson-num { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <a href="../" style="color:var(--text-muted);text-decoration:none;font-size:.85rem;display:inline-block;margin-bottom:.5rem;">&larr; Back to classes</a>
  <h1>成语 <span>谚语</span></h1>
  <p>Chinese Proverbs, Sayings &amp; Idioms</p>
</header>
<div class="lessons">
  <a href="lesson.html?id=chinese-proverbs" class="lesson-card">
    <div class="info">
      <h3>成语谚语 · Chinese Proverbs</h3>
      <p>22 classic proverbs &amp; idioms with example sentences — 熟能生巧, 入乡随俗, 塞翁失马 &amp; more</p>
    </div>
    <div class="lesson-num">22 Proverbs</div>
  </a>
</div>
<script src="../nav.js" defer></script>
</body>
</html>
