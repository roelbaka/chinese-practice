<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Practice - Improvers</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a2e;
    --card-hover: #222244;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #eee;
    --text-muted: #999;
    --pinyin: #f0c040;
    --english: #80d0ff;
    --success: #4caf50;
    --border: #2a2a4a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  }

  header h1 {
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: 2px;
  }

  header h1 span { color: var(--accent); font-weight: 600; }

  header p {
    color: var(--text-muted);
    margin-top: .4rem;
    font-size: .95rem;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .5rem;
    padding: 1rem;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }

  nav button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: .45rem 1rem;
    border-radius: 999px;
    cursor: pointer;
    font-size: .85rem;
    transition: all .2s;
  }

  nav button:hover { background: var(--card-hover); border-color: var(--accent); }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .mode-bar {
    display: flex;
    justify-content: center;
    gap: .5rem;
    padding: .8rem 1rem;
    background: #0a0a0a;
  }

  .mode-bar button {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: .4rem 1.2rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: .85rem;
    transition: all .2s;
  }

  .mode-bar button:hover { color: var(--text); }
  .mode-bar button.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
  }

  .card-grid {
    display: flex;
    flex-direction: column;
    gap: .75rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem 1.4rem;
    cursor: pointer;
    transition: all .25s;
    position: relative;
  }

  .card:hover { background: var(--card-hover); transform: translateX(4px); }

  .card .chinese {
    font-size: 1.55rem;
    margin-bottom: .35rem;
    line-height: 1.4;
  }

  .card .pinyin {
    color: var(--pinyin);
    font-size: .95rem;
    margin-bottom: .25rem;
    transition: opacity .3s;
  }

  .card .english {
    color: var(--english);
    font-size: .9rem;
    transition: opacity .3s;
  }

  .card.hide-pinyin .pinyin { opacity: 0; }
  .card.hide-english .english { opacity: 0; }
  .card.reveal .pinyin, .card.reveal .english { opacity: 1 !important; }

  .card .speaker-icon {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    background: var(--accent2);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .6;
    transition: opacity .2s;
  }

  .card .speaker-icon:hover { opacity: 1; }

  .flashcard-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding-top: 2rem;
  }

  .flashcard {
    width: 100%;
    max-width: 500px;
    min-height: 260px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    cursor: pointer;
    transition: all .3s;
    text-align: center;
    user-select: none;
  }

  .flashcard:hover { border-color: var(--accent); }

  .flashcard .chinese { font-size: 2.2rem; margin-bottom: .8rem; }
  .flashcard .pinyin { color: var(--pinyin); font-size: 1.1rem; margin-bottom: .5rem; }
  .flashcard .english { color: var(--english); font-size: 1rem; }
  .flashcard .hint { color: var(--text-muted); font-size: .8rem; margin-top: 1rem; }

  .flashcard .hidden { opacity: 0; }
  .flashcard.revealed .hidden { opacity: 1; }

  .fc-controls {
    display: flex;
    gap: 1rem;
    align-items: center;
  }

  .fc-controls button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: .6rem 1.5rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: .95rem;
    transition: all .2s;
  }

  .fc-controls button:hover { background: var(--card-hover); border-color: var(--accent); }

  .fc-progress {
    color: var(--text-muted);
    font-size: .85rem;
  }

  .quiz-container {
    max-width: 560px;
    margin: 0 auto;
    padding-top: 1.5rem;
  }

  .quiz-prompt {
    text-align: center;
    font-size: 2rem;
    margin-bottom: .5rem;
  }

  .quiz-pinyin-hint {
    text-align: center;
    color: var(--pinyin);
    font-size: 1rem;
    margin-bottom: 1.5rem;
  }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: .6rem;
  }

  .quiz-option {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    cursor: pointer;
    transition: all .2s;
    font-size: 1rem;
    color: var(--text);
    text-align: left;
  }

  .quiz-option:hover { background: var(--card-hover); border-color: var(--accent); }
  .quiz-option.correct { background: #1b4332; border-color: var(--success); }
  .quiz-option.wrong { background: #4a1525; border-color: var(--accent); }
  .quiz-option.disabled { pointer-events: none; }

  .quiz-score {
    text-align: center;
    margin-top: 1.5rem;
    color: var(--text-muted);
    font-size: .9rem;
  }

  .quiz-next {
    display: block;
    margin: 1.5rem auto 0;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: .6rem 2rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    transition: opacity .2s;
  }

  .quiz-next:hover { opacity: .85; }

  .toggle-row {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .toggle-row label {
    display: flex;
    align-items: center;
    gap: .4rem;
    font-size: .85rem;
    color: var(--text-muted);
    cursor: pointer;
  }

  .toggle-row input[type="checkbox"] {
    accent-color: var(--accent);
  }

  .section-title {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin: 1.5rem 0 .8rem;
    padding-left: .2rem;
  }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
  }

  .empty-state p { font-size: 1.1rem; margin-top: 1rem; }

  @media (max-width: 600px) {
    header h1 { font-size: 1.4rem; }
    .card .chinese { font-size: 1.25rem; }
    .flashcard .chinese { font-size: 1.7rem; }
    nav { gap: .3rem; }
    nav button { font-size: .75rem; padding: .35rem .7rem; }
  }
</style>
</head>

      { zh: "汉斯有很多爱好。", py: "Hānsī yǒu hěn duō àihào.", en: "Hans has many hobbies." },
      { zh: "他喜欢运动。", py: "Tā xǐhuan yùndòng.", en: "He likes sports." },
      { zh: "冬天滑冰，夏天游泳。", py: "Dōngtiān huá bīng, xiàtiān yóu yǒng.", en: "He ice skates in winter and swims in summer." },
      { zh: "到中国以后，他还学会了打太极拳。", py: "Dào Zhōngguó yǐhòu, tā hái xuéhuì le dǎ tàijíquán.", en: "After arriving in China, he also learned taijiquan." },
      { zh: "他画的画儿也不错。", py: "Tā huà de huàr yě búcuò.", en: "His paintings are also quite good." },
      { zh: "可是他也有一个不好的爱好，那就是抽烟。", py: "Kěshì tā yě yǒu yī gè bù hǎo de àihào, nà jiù shì chōu yān.", en: "But he also has a bad hobby — smoking." },
      { zh: "现在他身体不太好，要是不抽烟，他的身体一定比现在好。", py: "Xiànzài tā shēntǐ bú tài hǎo, yàoshi bù chōu yān, tā de shēntǐ yīdìng bǐ xiànzài hǎo.", en: "His health isn't great now. If he stopped smoking, he'd definitely be healthier." },
    ]
  },
  {
    topic: "语音 · Phonetic Drill (Animals)",
    items: [
      { zh: "你喜欢什么？", py: "Nǐ xǐhuan shénme?", en: "What do you like?" },
      { zh: "我喜欢动物。", py: "Wǒ xǐhuan dòngwù.", en: "I like animals." },
      { zh: "我也喜欢动物。", py: "Wǒ yě xǐhuan dòngwù.", en: "I also like animals." },
      { zh: "你喜欢什么动物？", py: "Nǐ xǐhuan shénme dòngwù?", en: "What animal do you like?" },
      { zh: "我喜欢小狗，你呢？", py: "Wǒ xǐhuan xiǎo gǒu, nǐ ne?", en: "I like dogs, and you?" },
      { zh: "我喜欢大熊猫。", py: "Wǒ xǐhuan dàxióngmāo.", en: "I like pandas." },
    ]
  },
];

let currentTopic = "all";
let currentMode = "browse";
let hidePinyin = false;
let hideEnglish = false;
let fcIndex = 0;
let fcRevealed = false;
let fcItems = [];
let quizItems = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswered = false;

function getItems() {
  if (currentTopic === "all") return DATA.flatMap(t => t.items);
  const section = DATA.find(t => t.topic === currentTopic);
  return section ? section.items : [];
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function renderNav() {
  const nav = document.getElementById("topicNav");
  const topics = [{ topic: "all", label: "All" }, ...DATA.map(t => ({ topic: t.topic, label: t.topic.split(" · ")[1] || t.topic }))];
  nav.innerHTML = topics.map(t =>
    `<button data-topic="${t.topic}" class="${currentTopic === t.topic ? 'active' : ''}">${t.label}</button>`
  ).join("");
  nav.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentTopic = btn.dataset.topic;
      renderNav();
      render();
    });
  });
}

function renderBrowse() {
  const app = document.getElementById("app");
  const items = getItems();
  if (!items.length) {
    app.innerHTML = `<div class="empty-state"><div style="font-size:3rem;">📚</div><p>No lessons added yet.<br>Transcripts will be added here after class.</p></div>`;
    return;
  }
  let html = `<div class="toggle-row">
    <label><input type="checkbox" id="togPy" ${hidePinyin ? "checked" : ""}> Hide pinyin</label>
    <label><input type="checkbox" id="togEn" ${hideEnglish ? "checked" : ""}> Hide English</label>
  </div>`;

  if (currentTopic === "all") {
    DATA.forEach(section => {
      html += `<div class="section-title">${section.topic}</div><div class="card-grid">`;
      section.items.forEach(item => {
        const cls = [hidePinyin ? "hide-pinyin" : "", hideEnglish ? "hide-english" : ""].filter(Boolean).join(" ");
        html += `<div class="card ${cls}" data-zh="${esc(item.zh)}">
          <div class="chinese">${esc(item.zh)}</div>
          <div class="pinyin">${esc(item.py)}</div>
          <div class="english">${esc(item.en)}</div>
          <button class="speaker-icon" title="Listen">&#9654;</button>
        </div>`;
      });
      html += `</div>`;
    });
  } else {
    html += `<div class="card-grid">`;
    items.forEach(item => {
      const cls = [hidePinyin ? "hide-pinyin" : "", hideEnglish ? "hide-english" : ""].filter(Boolean).join(" ");
      html += `<div class="card ${cls}" data-zh="${esc(item.zh)}">
        <div class="chinese">${esc(item.zh)}</div>
        <div class="pinyin">${esc(item.py)}</div>
        <div class="english">${esc(item.en)}</div>
        <button class="speaker-icon" title="Listen">&#9654;</button>
      </div>`;
    });
    html += `</div>`;
  }

  app.innerHTML = html;
  document.getElementById("togPy").addEventListener("change", e => { hidePinyin = e.target.checked; renderBrowse(); });
  document.getElementById("togEn").addEventListener("change", e => { hideEnglish = e.target.checked; renderBrowse(); });
  app.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest(".speaker-icon")) return;
      card.classList.toggle("reveal");
    });
    card.querySelector(".speaker-icon").addEventListener("click", () => speak(card.dataset.zh));
  });
}

function renderFlashcard() {
  const app = document.getElementById("app");
  if (!fcItems.length) {
    fcItems = shuffle(getItems());
    fcIndex = 0;
    fcRevealed = false;
  }
  if (!fcItems.length) {
    app.innerHTML = `<div class="empty-state"><div style="font-size:3rem;">📚</div><p>No lessons added yet.</p></div>`;
    return;
  }
  const item = fcItems[fcIndex];
  app.innerHTML = `<div class="flashcard-container">
    <div class="fc-progress">${fcIndex + 1} / ${fcItems.length}</div>
    <div class="flashcard" id="fc">
      <div class="chinese">${esc(item.zh)}</div>
      <div class="pinyin ${fcRevealed ? '' : 'hidden'}">${esc(item.py)}</div>
      <div class="english ${fcRevealed ? '' : 'hidden'}">${esc(item.en)}</div>
      <div class="hint">${fcRevealed ? 'Click arrows to navigate' : 'Click to reveal'}</div>
    </div>
    <div class="fc-controls">
      <button id="fcPrev">&larr; Prev</button>
      <button id="fcSpeak">&#9654; Listen</button>
      <button id="fcNext">Next &rarr;</button>
    </div>
    <div class="fc-controls">
      <button id="fcShuffle">Shuffle</button>
    </div>
  </div>`;

  document.getElementById("fc").addEventListener("click", () => { fcRevealed = !fcRevealed; renderFlashcard(); });
  document.getElementById("fcPrev").addEventListener("click", () => { fcIndex = (fcIndex - 1 + fcItems.length) % fcItems.length; fcRevealed = false; renderFlashcard(); });
  document.getElementById("fcNext").addEventListener("click", () => { fcIndex = (fcIndex + 1) % fcItems.length; fcRevealed = false; renderFlashcard(); });
  document.getElementById("fcSpeak").addEventListener("click", () => speak(item.zh));
  document.getElementById("fcShuffle").addEventListener("click", () => { fcItems = shuffle(getItems()); fcIndex = 0; fcRevealed = false; renderFlashcard(); });
}

function renderQuiz() {
  const app = document.getElementById("app");
  if (!quizItems.length) {
    const all = getItems();
    if (all.length < 4) {
      app.innerHTML = `<div class="empty-state"><div style="font-size:3rem;">📚</div><p>Need at least 4 items for quiz mode.</p></div>`;
      return;
    }
    quizItems = shuffle(all);
    quizIndex = 0;
    quizScore = 0;
    quizAnswered = false;
  }

  const item = quizItems[quizIndex];
  const allItems = getItems();
  let wrongs = shuffle(allItems.filter(i => i.en !== item.en)).slice(0, 3);
  let options = shuffle([item, ...wrongs]);

  app.innerHTML = `<div class="quiz-container">
    <div class="quiz-prompt">${esc(item.zh)}</div>
    <div class="quiz-pinyin-hint">${esc(item.py)}</div>
    <div class="quiz-options">
      ${options.map((o, i) => `<button class="quiz-option" data-idx="${i}" data-correct="${o.en === item.en}">${esc(o.en)}</button>`).join("")}
    </div>
    <div class="quiz-score">Score: ${quizScore} / ${quizIndex}${quizIndex < quizItems.length ? '' : ' — Done!'}</div>
    ${quizAnswered ? `<button class="quiz-next" id="quizNext">${quizIndex + 1 < quizItems.length ? 'Next &rarr;' : 'Restart'}</button>` : ''}
  </div>`;

  if (!quizAnswered) {
    app.querySelectorAll(".quiz-option").forEach(btn => {
      btn.addEventListener("click", () => {
        quizAnswered = true;
        const correct = btn.dataset.correct === "true";
        if (correct) quizScore++;
        btn.classList.add(correct ? "correct" : "wrong");
        if (!correct) {
          app.querySelector('.quiz-option[data-correct="true"]').classList.add("correct");
        }
        app.querySelectorAll(".quiz-option").forEach(b => b.classList.add("disabled"));
        renderQuizControls();
      });
    });
  }
}

function renderQuizControls() {
  const container = document.querySelector(".quiz-container");
  const scoreEl = container.querySelector(".quiz-score");
  scoreEl.textContent = `Score: ${quizScore} / ${quizIndex + 1}`;

  const existing = document.getElementById("quizNext");
  if (existing) existing.remove();

  const btn = document.createElement("button");
  btn.className = "quiz-next";
  btn.id = "quizNext";
  btn.textContent = quizIndex + 1 < quizItems.length ? "Next →" : "Restart";
  container.appendChild(btn);

  btn.addEventListener("click", () => {
    if (quizIndex + 1 < quizItems.length) {
      quizIndex++;
      quizAnswered = false;
      renderQuiz();
    } else {
      quizItems = [];
      renderQuiz();
    }
  });
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function render() {
  fcItems = [];
  quizItems = [];
  if (currentMode === "browse") renderBrowse();
  else if (currentMode === "flashcard") renderFlashcard();
  else if (currentMode === "quiz") renderQuiz();
}

document.querySelectorAll(".mode-bar button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-bar button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMode = btn.dataset.mode;
    render();
  });
});

document.addEventListener("keydown", e => {
  if (currentMode === "flashcard") {
    if (e.key === "ArrowRight") { fcIndex = (fcIndex + 1) % fcItems.length; fcRevealed = false; renderFlashcard(); }
    if (e.key === "ArrowLeft") { fcIndex = (fcIndex - 1 + fcItems.length) % fcItems.length; fcRevealed = false; renderFlashcard(); }
    if (e.key === " ") { e.preventDefault(); fcRevealed = !fcRevealed; renderFlashcard(); }
  }
});

renderNav();
render();
</script>

</html>
