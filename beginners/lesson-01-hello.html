<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Practice - Lesson 1: 你好</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a2e;
    --card-hover: #222244;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #eee;
    --text-muted: #999;
    --pinyin: #f0c040;
    --english: #80d0ff;
    --success: #4caf50;
    --border: #2a2a4a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  }

  header h1 {
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: 2px;
  }

  header h1 span { color: var(--accent); font-weight: 600; }

  header p {
    color: var(--text-muted);
    margin-top: .4rem;
    font-size: .95rem;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .5rem;
    padding: 1rem;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }

  nav button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: .45rem 1rem;
    border-radius: 999px;
    cursor: pointer;
    font-size: .85rem;
    transition: all .2s;
  }

  nav button:hover { background: var(--card-hover); border-color: var(--accent); }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .mode-bar {
    display: flex;
    justify-content: center;
    gap: .5rem;
    padding: .8rem 1rem;
    background: #0a0a0a;
  }

  .mode-bar button {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: .4rem 1.2rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: .85rem;
    transition: all .2s;
  }

  .mode-bar button:hover { color: var(--text); }
  .mode-bar button.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
  }

  .card-grid {
    display: flex;
    flex-direction: column;
    gap: .75rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.2rem 1.4rem;
    cursor: pointer;
    transition: all .25s;
    position: relative;
  }

  .card:hover { background: var(--card-hover); transform: translateX(4px); }

  .card .chinese {
    font-size: 1.55rem;
    margin-bottom: .35rem;
    line-height: 1.4;
  }

  .card .pinyin {
    color: var(--pinyin);
    font-size: .95rem;
    margin-bottom: .25rem;
    transition: opacity .3s;
  }

  .card .english {
    color: var(--english);
    font-size: .9rem;
    transition: opacity .3s;
  }

  .card.hide-pinyin .pinyin { opacity: 0; }
  .card.hide-english .english { opacity: 0; }
  .card.reveal .pinyin, .card.reveal .english { opacity: 1 !important; }

  .card .speaker-icon {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: .75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
  }

  .card .speaker-icon:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  .flashcard-container { text-align: center; padding: 2rem 0; }

  .flashcard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3rem 2rem;
    max-width: 500px;
    margin: 0 auto;
    cursor: pointer;
    transition: all .3s;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .flashcard:hover { border-color: var(--accent); }
  .flashcard .chinese { font-size: 2.2rem; margin-bottom: .5rem; }
  .flashcard .pinyin { color: var(--pinyin); font-size: 1.1rem; margin-bottom: .3rem; }
  .flashcard .english { color: var(--english); font-size: 1rem; }
  .flashcard .hidden { opacity: 0; }
  .flashcard .hint { color: var(--text-muted); font-size: .8rem; margin-top: 1rem; }

  .fc-controls {
    display: flex;
    justify-content: center;
    gap: .5rem;
    margin-top: 1.2rem;
  }

  .fc-controls button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: .5rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
  }

  .fc-controls button:hover { background: var(--accent); border-color: var(--accent); }

  .fc-progress {
    color: var(--text-muted);
    font-size: .85rem;
    margin-bottom: 1rem;
  }

  .quiz-container { max-width: 600px; margin: 0 auto; text-align: center; }
  .quiz-prompt { font-size: 2rem; margin: 1.5rem 0 .5rem; }
  .quiz-pinyin-hint { color: var(--pinyin); font-size: 1rem; margin-bottom: 1.5rem; }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }

  .quiz-option {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: .9rem 1.2rem;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    transition: all .2s;
    text-align: left;
  }

  .quiz-option:hover:not(.disabled) { background: var(--card-hover); border-color: var(--accent); }
  .quiz-option.correct { background: #1b5e20; border-color: var(--success); }
  .quiz-option.wrong { background: #b71c1c; border-color: #f44336; }
  .quiz-option.disabled { pointer-events: none; opacity: .8; }

  .quiz-score { color: var(--text-muted); margin-top: 1.5rem; font-size: .9rem; }

  .quiz-next {
    margin-top: 1rem;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: .6rem 1.5rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: .9rem;
  }

  .toggle-row {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .toggle-row label {
    display: flex;
    align-items: center;
    gap: .4rem;
    font-size: .85rem;
    color: var(--text-muted);
    cursor: pointer;
  }

  .toggle-row input[type="checkbox"] {
    accent-color: var(--accent);
  }

  .section-title {
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin: 1.5rem 0 .8rem;
    padding-left: .2rem;
  }

  @media (max-width: 600px) {
    header h1 { font-size: 1.4rem; }
    .card .chinese { font-size: 1.25rem; }
    .flashcard .chinese { font-size: 1.7rem; }
    nav { gap: .3rem; }
    nav button { font-size: .75rem; padding: .35rem .7rem; }
  }
</style>
</head>
<body>

<header>
  <a href="./" style="color:var(--text-muted);text-decoration:none;font-size:.85rem;display:inline-block;margin-bottom:.5rem;">&larr; Back to Beginners</a>
  <h1>初级 <span>Beginners</span></h1>
  <p>Lesson 1 — 你好 · Hello</p>
</header>

<nav id="topicNav"></nav>

<div class="mode-bar">
  <button class="active" data-mode="browse">Browse</button>
  <button data-mode="flashcard">Flashcards</button>
  <button data-mode="quiz">Quiz</button>
</div>

<main id="app"></main>

<script>
const DATA = [
  {
    topic: "句子 · Key Sentences",
    items: [
      { zh: "你好！", py: "Nǐ hǎo!", en: "Hello!" },
      { zh: "你们好！", py: "Nǐmen hǎo!", en: "Hello everyone!" },
      { zh: "你好吗？", py: "Nǐ hǎo ma?", en: "How are you?" },
      { zh: "很好，谢谢。", py: "Hěn hǎo, xièxie.", en: "Very well, thank you." },
      { zh: "你呢？", py: "Nǐ ne?", en: "And you?" },
      { zh: "我也很好。", py: "Wǒ yě hěn hǎo.", en: "I'm fine too." },
      { zh: "他们都很好。", py: "Tāmen dōu hěn hǎo.", en: "They are all fine." },
      { zh: "不客气。", py: "Bú kèqi.", en: "You're welcome." },
    ]
  },
  {
    topic: "会话1 · Dialogue 1",
    items: [
      { zh: "大卫：你好！", py: "Dàwèi: Nǐ hǎo!", en: "David: Hello!" },
      { zh: "和子：你好！", py: "Hézǐ: Nǐ hǎo!", en: "Kazuko: Hello!" },
    ]
  },
  {
    topic: "会话2 · Dialogue 2",
    items: [
      { zh: "玛丽：你好吗？", py: "Mǎlì: Nǐ hǎo ma?", en: "Mary: How are you?" },
      { zh: "和子：很好，谢谢。你呢？", py: "Hézǐ: Hěn hǎo, xièxie. Nǐ ne?", en: "Kazuko: Very well, thanks. And you?" },
      { zh: "玛丽：我也很好。", py: "Mǎlì: Wǒ yě hěn hǎo.", en: "Mary: I'm fine too." },
    ]
  },
  {
    topic: "会话3 · Dialogue 3",
    items: [
      { zh: "老师：你们好！", py: "Lǎoshī: Nǐmen hǎo!", en: "Teacher: Hello everyone!" },
      { zh: "学生们：老师好！", py: "Xuéshengmen: Lǎoshī hǎo!", en: "Students: Hello teacher!" },
      { zh: "老师：他们好吗？", py: "Lǎoshī: Tāmen hǎo ma?", en: "Teacher: How are they?" },
      { zh: "学生们：他们都很好。", py: "Xuéshengmen: Tāmen dōu hěn hǎo.", en: "Students: They are all fine." },
    ]
  },
  {
    topic: "生词 · New Words",
    items: [
      { zh: "你", py: "nǐ", en: "you" },
      { zh: "好", py: "hǎo", en: "good, well, fine" },
      { zh: "们", py: "men", en: "(plural suffix for pronouns)" },
      { zh: "你们", py: "nǐmen", en: "you (plural)" },
      { zh: "我", py: "wǒ", en: "I, me" },
      { zh: "我们", py: "wǒmen", en: "we, us" },
      { zh: "他", py: "tā", en: "he, him" },
      { zh: "她", py: "tā", en: "she, her" },
      { zh: "他们", py: "tāmen", en: "they, them" },
      { zh: "也", py: "yě", en: "also, too" },
      { zh: "都", py: "dōu", en: "all, both" },
      { zh: "吗", py: "ma", en: "(question particle)" },
      { zh: "呢", py: "ne", en: "(question particle: 'and...?')" },
      { zh: "很", py: "hěn", en: "very" },
      { zh: "不", py: "bù", en: "not, no" },
      { zh: "谢谢", py: "xièxie", en: "thank you" },
      { zh: "客气", py: "kèqi", en: "polite, courteous" },
      { zh: "不客气", py: "bú kèqi", en: "you're welcome" },
    ]
  },
  {
    topic: "语法 · Grammar",
    items: [
      { zh: "我很好。", py: "Wǒ hěn hǎo.", en: "I am fine. (很 + adjective = 'am/is' + adj)" },
      { zh: "他也很好。", py: "Tā yě hěn hǎo.", en: "He is fine too. (也 = also, before the verb)" },
      { zh: "他们都很好。", py: "Tāmen dōu hěn hǎo.", en: "They are all fine. (都 = all, before the verb)" },
      { zh: "你好吗？", py: "Nǐ hǎo ma?", en: "Are you well? (吗 turns a statement into a question)" },
      { zh: "你呢？", py: "Nǐ ne?", en: "And you? (呢 asks 'what about...?')" },
      { zh: "我不好。", py: "Wǒ bù hǎo.", en: "I'm not good. (不 negates adjectives/verbs)" },
    ]
  },
  {
    topic: "练习 · Workbook Exercises",
    items: [
      { zh: "爸爸好吗？", py: "Bàba hǎo ma?", en: "How is Dad?" },
      { zh: "爸爸也好。", py: "Bàba yě hǎo.", en: "Dad is fine too." },
      { zh: "妈妈好吗？", py: "Māma hǎo ma?", en: "How is Mom?" },
      { zh: "妈妈也好。", py: "Māma yě hǎo.", en: "Mom is fine too." },
      { zh: "我们都来了。", py: "Wǒmen dōu lái le.", en: "We all came." },
      { zh: "他们都很好。", py: "Tāmen dōu hěn hǎo.", en: "They are all fine." },
      { zh: "你也来吗？", py: "Nǐ yě lái ma?", en: "Are you also coming?" },
    ]
  },
];

let currentTopic = "all";
let currentMode = "browse";
let hidePinyin = false;
let hideEnglish = false;
let fcItems = [], fcIndex = 0, fcRevealed = false;
let quizItems = [], quizIndex = 0, quizScore = 0, quizAnswered = false;

function getItems() {
  if (currentTopic === "all") return DATA.flatMap(t => t.items);
  return DATA.find(t => t.topic === currentTopic)?.items || [];
}

function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function renderNav() {
  const nav = document.getElementById("topicNav");
  const topics = [{ topic: "all", label: "All" }, ...DATA.map(t => ({ topic: t.topic, label: t.topic.split(" · ")[1] || t.topic }))];
  nav.innerHTML = topics.map(t =>
    `<button data-topic="${t.topic}" class="${currentTopic === t.topic ? 'active' : ''}">${t.label}</button>`
  ).join("");
  nav.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      currentTopic = btn.dataset.topic;
      renderNav();
      render();
    });
  });
}

function renderBrowse() {
  const app = document.getElementById("app");
  let html = `<div class="toggle-row">
    <label><input type="checkbox" id="togPy" ${hidePinyin ? "checked" : ""}> Hide pinyin</label>
    <label><input type="checkbox" id="togEn" ${hideEnglish ? "checked" : ""}> Hide English</label>
  </div>`;

  if (currentTopic === "all") {
    DATA.forEach(section => {
      html += `<div class="section-title">${section.topic}</div><div class="card-grid">`;
      section.items.forEach(item => {
        const cls = [hidePinyin ? "hide-pinyin" : "", hideEnglish ? "hide-english" : ""].filter(Boolean).join(" ");
        html += `<div class="card ${cls}" data-zh="${esc(item.zh)}">
          <div class="chinese">${esc(item.zh)}</div>
          <div class="pinyin">${esc(item.py)}</div>
          <div class="english">${esc(item.en)}</div>
          <button class="speaker-icon" title="Listen">&#9654;</button>
        </div>`;
      });
      html += `</div>`;
    });
  } else {
    const items = getItems();
    html += `<div class="card-grid">`;
    items.forEach(item => {
      const cls = [hidePinyin ? "hide-pinyin" : "", hideEnglish ? "hide-english" : ""].filter(Boolean).join(" ");
      html += `<div class="card ${cls}" data-zh="${esc(item.zh)}">
        <div class="chinese">${esc(item.zh)}</div>
        <div class="pinyin">${esc(item.py)}</div>
        <div class="english">${esc(item.en)}</div>
        <button class="speaker-icon" title="Listen">&#9654;</button>
      </div>`;
    });
    html += `</div>`;
  }

  app.innerHTML = html;

  document.getElementById("togPy").addEventListener("change", e => { hidePinyin = e.target.checked; renderBrowse(); });
  document.getElementById("togEn").addEventListener("change", e => { hideEnglish = e.target.checked; renderBrowse(); });

  app.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest(".speaker-icon")) return;
      card.classList.toggle("reveal");
    });
    card.querySelector(".speaker-icon").addEventListener("click", () => speak(card.dataset.zh));
  });
}

function renderFlashcard() {
  const app = document.getElementById("app");
  if (!fcItems.length) {
    fcItems = shuffle(getItems());
    fcIndex = 0;
    fcRevealed = false;
  }
  const item = fcItems[fcIndex];
  app.innerHTML = `<div class="flashcard-container">
    <div class="fc-progress">${fcIndex + 1} / ${fcItems.length}</div>
    <div class="flashcard" id="fc">
      <div class="chinese">${esc(item.zh)}</div>
      <div class="pinyin ${fcRevealed ? '' : 'hidden'}">${esc(item.py)}</div>
      <div class="english ${fcRevealed ? '' : 'hidden'}">${esc(item.en)}</div>
      <div class="hint">${fcRevealed ? 'Click arrows to navigate' : 'Click to reveal'}</div>
    </div>
    <div class="fc-controls">
      <button id="fcPrev">&larr; Prev</button>
      <button id="fcSpeak">&#9654; Listen</button>
      <button id="fcNext">Next &rarr;</button>
    </div>
    <div class="fc-controls">
      <button id="fcShuffle">Shuffle</button>
    </div>
  </div>`;

  document.getElementById("fc").addEventListener("click", () => { fcRevealed = !fcRevealed; renderFlashcard(); });
  document.getElementById("fcPrev").addEventListener("click", () => { fcIndex = (fcIndex - 1 + fcItems.length) % fcItems.length; fcRevealed = false; renderFlashcard(); });
  document.getElementById("fcNext").addEventListener("click", () => { fcIndex = (fcIndex + 1) % fcItems.length; fcRevealed = false; renderFlashcard(); });
  document.getElementById("fcSpeak").addEventListener("click", () => speak(item.zh));
  document.getElementById("fcShuffle").addEventListener("click", () => { fcItems = shuffle(getItems()); fcIndex = 0; fcRevealed = false; renderFlashcard(); });
}

function renderQuiz() {
  const app = document.getElementById("app");
  if (!quizItems.length) {
    const all = getItems();
    if (all.length < 4) {
      app.innerHTML = `<p style="text-align:center;color:var(--text-muted);padding:2rem;">Select a topic with at least 4 items for quiz mode.</p>`;
      return;
    }
    quizItems = shuffle(all);
    quizIndex = 0;
    quizScore = 0;
    quizAnswered = false;
  }

  const item = quizItems[quizIndex];
  const allItems = getItems();
  let wrongs = shuffle(allItems.filter(i => i.en !== item.en)).slice(0, 3);
  let options = shuffle([item, ...wrongs]);

  app.innerHTML = `<div class="quiz-container">
    <div class="quiz-prompt">${esc(item.zh)}</div>
    <div class="quiz-pinyin-hint">${esc(item.py)}</div>
    <div class="quiz-options">
      ${options.map((o, i) => `<button class="quiz-option" data-idx="${i}" data-correct="${o.en === item.en}">${esc(o.en)}</button>`).join("")}
    </div>
    <div class="quiz-score">Score: ${quizScore} / ${quizIndex}${quizIndex < quizItems.length ? '' : ' — Done!'}</div>
    ${quizAnswered ? `<button class="quiz-next" id="quizNext">${quizIndex + 1 < quizItems.length ? 'Next &rarr;' : 'Restart'}</button>` : ''}
  </div>`;

  if (!quizAnswered) {
    app.querySelectorAll(".quiz-option").forEach(btn => {
      btn.addEventListener("click", () => {
        quizAnswered = true;
        const correct = btn.dataset.correct === "true";
        if (correct) quizScore++;
        btn.classList.add(correct ? "correct" : "wrong");
        if (!correct) {
          app.querySelector('.quiz-option[data-correct="true"]').classList.add("correct");
        }
        app.querySelectorAll(".quiz-option").forEach(b => b.classList.add("disabled"));
        renderQuizControls();
      });
    });
  }
}

function renderQuizControls() {
  const container = document.querySelector(".quiz-container");
  const scoreEl = container.querySelector(".quiz-score");
  scoreEl.textContent = `Score: ${quizScore} / ${quizIndex + 1}`;

  const existing = document.getElementById("quizNext");
  if (existing) existing.remove();

  const btn = document.createElement("button");
  btn.className = "quiz-next";
  btn.id = "quizNext";
  btn.textContent = quizIndex + 1 < quizItems.length ? "Next →" : "Restart";
  container.appendChild(btn);

  btn.addEventListener("click", () => {
    if (quizIndex + 1 < quizItems.length) {
      quizIndex++;
      quizAnswered = false;
      renderQuiz();
    } else {
      quizItems = [];
      renderQuiz();
    }
  });
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function render() {
  fcItems = [];
  quizItems = [];
  if (currentMode === "browse") renderBrowse();
  else if (currentMode === "flashcard") renderFlashcard();
  else if (currentMode === "quiz") renderQuiz();
}

document.querySelectorAll(".mode-bar button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-bar button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMode = btn.dataset.mode;
    render();
  });
});

document.addEventListener("keydown", e => {
  if (currentMode === "flashcard") {
    if (e.key === "ArrowRight") { fcIndex = (fcIndex + 1) % fcItems.length; fcRevealed = false; renderFlashcard(); }
    if (e.key === "ArrowLeft") { fcIndex = (fcIndex - 1 + fcItems.length) % fcItems.length; fcRevealed = false; renderFlashcard(); }
    if (e.key === " ") { e.preventDefault(); fcRevealed = !fcRevealed; renderFlashcard(); }
  }
});

renderNav();
render();
</script>
</body>
</html>
